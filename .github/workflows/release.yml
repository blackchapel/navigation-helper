name: Production Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Full history -- versionCode is derived from commit count below,
          # which a shallow (default depth-1) clone would always report as 1.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          BASE_VERSION=$(grep '^VERSION_NAME=' app/version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version_name=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.version_code }} \
            -PappVersionName=${{ steps.version.outputs.version_name }}

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ridelink-release-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_STATUS: ${{ job.status }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          if [ "$BUILD_STATUS" = "success" ]; then
            TITLE="🚀 RideLink production release built"
            COLOR=3066993
          else
            TITLE="❌ RideLink production release failed"
            COLOR=15158332
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg version "${VERSION_NAME} (code ${VERSION_CODE})" \
            --arg commit "$SHORT_SHA" \
            --arg artifact "$ARTIFACT_URL" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: (
                  [
                    {name: "Version", value: $version, inline: true},
                    {name: "Commit", value: $commit, inline: true}
                  ]
                  + (if $artifact != "" then [{name: "Artifact", value: $artifact, inline: false}] else [] end)
                )
              }]
            }')
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
